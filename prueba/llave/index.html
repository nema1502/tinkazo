<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fff6e9" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171126" />
<title>Prueba de la llave</title>
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
<style>
:root {
  --fondo: #fff6e9;
  --tinta: #1d1630;
  --suave: #5a4f6e;
  --linea: #d9cdb8;
  --acento: #7a2e8e;
  --sobre-acento: #ffffff;
  --aviso-fondo: #f5e3b3;
  --aviso-tinta: #3d2c00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #171126;
    --tinta: #f4ecff;
    --suave: #b9aed0;
    --linea: #3a2f55;
    --acento: #c58be0;
    --sobre-acento: #171126;
    --aviso-fondo: #3d3210;
    --aviso-tinta: #fbe9a6;
  }
}
:root[data-theme="dark"] {
  --fondo: #171126;
  --tinta: #f4ecff;
  --suave: #b9aed0;
  --linea: #3a2f55;
  --acento: #c58be0;
  --sobre-acento: #171126;
  --aviso-fondo: #3d3210;
  --aviso-tinta: #fbe9a6;
}
* { box-sizing: border-box; }
html { background: var(--fondo); color: var(--tinta); font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: var(--fondo); color: var(--tinta); }
.aviso { margin: 0; padding: 8px 16px; background: var(--aviso-fondo); color: var(--aviso-tinta); font-size: 14px; text-align: center; }
html[lang="es"] [data-l="en"], html[lang="en"] [data-l="es"] { display: none; }
main { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; padding: 32px 16px; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
h1 { margin: 0; font-size: 28px; line-height: 1.2; }
#linea { margin: 0; color: var(--suave); }
button { font: inherit; cursor: pointer; border-radius: 12px; min-height: 48px; padding: 12px 20px; border: 2px solid var(--acento); }
button[hidden] { display: none; }
#principal { background: var(--acento); color: var(--sobre-acento); font-weight: 600; }
#secundario { background: transparent; color: var(--acento); border-color: transparent; text-decoration: underline; }
button:focus-visible, summary:focus-visible, a:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }
#copiado { margin: 0; min-height: 1.5em; color: var(--suave); font-size: 15px; }
details { border-top: 1px solid var(--linea); padding-top: 12px; color: var(--suave); font-size: 15px; }
details[hidden] { display: none; }
summary { cursor: pointer; min-height: 32px; }
table { width: 100%; border-collapse: collapse; margin: 8px 0; }
th, td { text-align: left; padding: 4px 6px 4px 0; border-bottom: 1px solid var(--linea); font-size: 14px; vertical-align: top; }
td.n { font-variant-numeric: tabular-nums; }
footer { padding: 16px; text-align: center; font-size: 14px; }
footer a { color: var(--acento); }
</style>
</head>
<body>
<p class="aviso" role="note"><span data-l="es">Es una prueba. Nada de acá vale plata.</span><span data-l="en">This is a test. Nothing here is worth money.</span></p>
<main>
  <h1 id="titulo"></h1>
  <p id="linea" aria-live="polite"></p>
  <button id="principal" data-accion="principal" type="button" hidden></button>
  <button id="secundario" data-accion="secundario" type="button" hidden></button>
  <p id="copiado" role="status"></p>
  <details id="costos" hidden></details>
  <noscript><p><span data-l="es">Esta prueba necesita JavaScript.</span><span data-l="en">This test needs JavaScript.</span></p></noscript>
</main>
<footer><a href="/">Tinkazo</a></footer>
<script type="module" src="/src/prueba-llave/pagina.ts"></script>
</body>
</html>
