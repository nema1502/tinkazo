<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Panel de la empresa aliada, en Tinkazo</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<meta name="description" content="La empresa ve su saldo, arma su campaña con botones y la deposita con su billetera." />
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<style>
.epi { max-width: 640px; margin: 0 auto; padding: 0 16px 48px; }
.epi h1 { font-size: 1.5rem; margin: 24px 0 4px; }
.epi-intro { color: var(--tq-tenue, #777); margin: 0 0 16px; }
.epi-titulo-seccion { font-size: 1.1rem; margin: 24px 0 4px; }
.epi-linea-seccion { margin: 0 0 12px; }
.epi-tarjeta { border: 1px solid var(--tq-nombre, #dde); border-radius: 12px; padding: 12px; margin: 12px 0; }
.epi-fila { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 8px 0; }
.epi-etiqueta { font-weight: 600; }
.epi-contador { min-width: 64px; text-align: center; }
.epi-totales { border-top: 1px solid var(--tq-nombre, #dde); margin-top: 12px; padding-top: 8px; }
.epi-fila-total { display: flex; justify-content: space-between; margin: 4px 0; }
.epi-total-grande { font-weight: 700; }
.epi-estado { margin: 8px 0; }
.epi-bien { color: var(--tq-bien, #0a7d33); }
.epi-falta { color: var(--tq-falta, #b3261e); }
.epi-cuenta-mostrada, .epi-nota { color: var(--tq-tenue, #777); }
.epi-cita { color: var(--tq-tenue, #777); font-size: 0.9rem; margin: 4px 0; }
.epi-enlace { display: block; margin: 8px 0; word-break: break-all; }
.epi-vista-lista { list-style: none; padding: 0; margin: 0; }
.epi-vista-lista li { padding: 4px 0; }
.epi-cajas-vista { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .epi-cajas-vista { grid-template-columns: 1fr 1fr; } }
.epi-vista { border: 8px solid #222; border-radius: 24px; padding: 12px; min-height: 180px; }
.epi input, .epi select { max-width: 100%; }
.epi button.on { font-weight: 700; outline: 2px solid currentColor; }
</style>
</head>
<body>
<header>
  <div class="stripe"></div>
  <div class="bar">
    <a class="wordmark" href="/" aria-label="Tinkazo">
      <span class="wm-llama" aria-hidden="true">
        <svg viewBox="-1 -3 24 28">
          <rect x="2" y="11" width="16" height="7" />
          <rect x="15" y="3" width="4" height="10" />
          <rect x="14" y="0" width="8" height="4" />
          <rect x="20" y="-2" width="2" height="3" />
          <rect x="3" y="18" width="2.5" height="6" />
          <rect x="8" y="18" width="2.5" height="6" />
          <rect x="12.5" y="18" width="2.5" height="6" />
          <rect x="16" y="18" width="2.5" height="6" />
          <rect x="0" y="9" width="3" height="4" />
        </svg>
      </span>
      <span class="wm-text">Tinka<b>zo</b></span>
    </a>
    <nav class="topnav" aria-label="páginas">
      <a href="/#sortear" class="nav-app" data-i="navSortear">Sortear</a>
      <a href="/#mis-sorteos" data-i="navMis">Mis sorteos</a>
      <div class="mas">
        <button type="button" class="mas-btn" data-i="navMas">Más</button>
        <div class="mas-lista">
          <a href="/juegos.html" data-i="navJuegos">Juegos</a>
          <a href="/como-funciona.html" data-i="navComo">Cómo funciona</a>
        </div>
      </div>
    </nav>
    <nav class="langs" aria-label="idioma">
      <button id="l-es" class="on" type="button">es</button>
      <button id="l-en" type="button">en</button>
    </nav>
  </div>
</header>
<main class="epi" id="epi">
  <h1 id="epi-titulo"></h1>
  <p id="epi-intro"></p>

  <section aria-labelledby="epi-cuenta-titulo">
    <h2 class="epi-titulo-seccion" id="epi-cuenta-titulo"></h2>
    <p id="epi-cuenta-linea"></p>
    <div class="epi-fila">
      <input id="epi-cuenta" type="text" autocomplete="off" spellcheck="false" />
      <button id="epi-cuenta-pegar" type="button"></button>
      <button id="epi-cuenta-billetera" type="button"></button>
    </div>
    <div id="epi-saldo" aria-live="polite"></div>
  </section>

  <section aria-labelledby="epi-nombre-titulo">
    <h2 class="epi-titulo-seccion" id="epi-nombre-titulo"></h2>
    <div class="epi-fila">
      <input id="epi-nombre" type="text" autocomplete="off" spellcheck="false" />
    </div>
  </section>

  <section aria-labelledby="epi-eventos-titulo">
    <h2 class="epi-titulo-seccion" id="epi-eventos-titulo"></h2>
    <p class="epi-linea-seccion" id="epi-eventos-linea"></p>
    <div id="epi-eventos"></div>
    <div class="epi-fila">
      <button id="epi-evento-agregar" type="button"></button>
    </div>
  </section>

  <section aria-labelledby="epi-premios-titulo">
    <h2 class="epi-titulo-seccion" id="epi-premios-titulo"></h2>
    <p class="epi-linea-seccion" id="epi-premios-linea"></p>
    <div id="epi-premios"></div>
  </section>

  <section aria-labelledby="epi-pasos-titulo">
    <h2 class="epi-titulo-seccion" id="epi-pasos-titulo"></h2>
    <p class="epi-linea-seccion" id="epi-pasos-linea"></p>
    <div id="epi-pasos"></div>
    <div class="epi-fila">
      <button id="epi-paso-agregar" type="button"></button>
    </div>
  </section>

  <section aria-labelledby="epi-vista-titulo">
    <h2 class="epi-titulo-seccion" id="epi-vista-titulo"></h2>
    <p class="epi-linea-seccion" id="epi-vista-linea"></p>
    <div class="epi-cajas-vista">
      <div>
        <h3 id="epi-vista-es-titulo"></h3>
        <div class="epi-vista" id="epi-vista-es" lang="es"></div>
      </div>
      <div>
        <h3 id="epi-vista-en-titulo"></h3>
        <div class="epi-vista" id="epi-vista-en" lang="en"></div>
      </div>
    </div>
  </section>

  <section aria-labelledby="epi-publicar-titulo">
    <h2 class="epi-titulo-seccion" id="epi-publicar-titulo"></h2>
    <p class="epi-linea-seccion" id="epi-publicar-linea"></p>
    <div class="epi-fila">
      <button id="epi-publicar" type="button"></button>
    </div>
    <p id="epi-publicar-aviso" aria-live="polite"></p>
    <div id="epi-publicada"></div>
    <div id="epi-deposito-caja" hidden></div>
  </section>

  <section aria-labelledby="epi-informe-titulo">
    <h2 class="epi-titulo-seccion" id="epi-informe-titulo"></h2>
    <div id="epi-informe"></div>
  </section>

  <section aria-labelledby="epi-organizador-titulo">
    <h2 class="epi-titulo-seccion" id="epi-organizador-titulo"></h2>
    <p class="epi-linea-seccion" id="epi-organizador-linea"></p>
    <div id="epi-organizador"></div>
  </section>

  <p id="epi-pie"></p>
</main>

<footer><div class="bar">
  <span data-i="footL">Tinkazo</span>
  <nav class="pies" aria-label="secciones">
    <a href="/juegos.html" data-i="navJuegos">Juegos</a>
    <a href="/como-funciona.html" data-i="navComo">Cómo funciona</a>
    <a href="/historia.html" data-i="navHistoria">Historia</a>
    <a href="/marca.html" data-i="navMarca">Marca</a>
    <a href="/seguridad.html" data-i="navSeguridad">Seguridad</a>
    <a href="/precios.html" data-i="navPrecios">Precios</a>
    <a href="/terminos.html" data-i="navTerminos">Términos</a>
    <a href="/sorteo-para-meetup.html" data-i="navMeetup">Sorteo para meetup</a>
    <a href="/sorteo-en-clase.html" data-i="navClase">Sorteo en clase</a>
    <a href="/sorteo-verificable.html" data-i="navVerif">Sorteo verificable</a>
    <a href="/ruleta-de-nombres.html" data-i="navRuleta">Ruleta de nombres</a>
    <a href="/sorteo-para-eventos.html" data-i="navEventos">Sorteo para eventos</a>
    <a href="/empresa.html" data-i="navEmpresas">Para empresas</a>
    <a href="https://github.com/nema1502/tinkazo" target="_blank" rel="noopener" data-i="navCodigo">Código</a>
    <a href="https://www.instagram.com/tinkazo.app/" target="_blank" rel="noopener" data-i="navInstagram">Instagram</a>
    <a href="https://tally.so/r/KpzoAA" target="_blank" rel="noopener" data-feedback="pie" data-i="navFeedback">Contanos qué mejorar</a>
  </nav>
  <span data-i="footR">Hecho con ♥ en Bolivia</span>
</div></footer>
<script type="module" src="/src/ui/empresa-panel.ts"></script>
</body>
</html>
