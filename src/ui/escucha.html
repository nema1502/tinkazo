<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Página de escucha</title>
<meta name="robots" content="noindex" />
<!--
  La página de escucha de la música (issue #135, S5): las candidatas por juego se eligen acá, con oídos,
  y ninguna se prende en el sitio sin esa elección. Está aparte del selector y sin entrada en el build
  (no va en rollupOptions.input de vite.config.ts): por lo mismo solo se la ve en `pnpm dev`, en
  /src/ui/escucha.html, y con ?escucha=1 (el propio escucha.ts lo pide). Cuando el dueño llegue a su
  máquina, la entrada del build se suma aparte.
-->
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #171126; color: #fff6e9; }
  main { max-width: 40rem; margin: 0 auto; padding: 1rem; }
  .apagada { margin: 4rem auto; text-align: center; opacity: 0.8; }
  h1 { font-size: 1.4rem; }
  .nota, .aviso-sin-audio { font-size: 0.8rem; opacity: 0.7; }
  .aviso-sin-audio { color: #ffd9a0; }
  .tarjeta { border: 1px solid #3a2f52; border-radius: 12px; padding: 0.8rem 1rem; margin: 1rem 0; }
  .tarjeta h2 { margin: 0.2rem 0; font-size: 1.1rem; }
  .datos { font-size: 0.85rem; opacity: 0.85; }
  .chip { display: inline-block; background: #2a2140; border-radius: 999px; padding: 0.05rem 0.6rem; margin: 0 0.2rem; }
  .capas { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.6rem 0; }
  .capas button { background: #3a2f52; border: 0; color: #fff6e9; border-radius: 8px; padding: 0.4rem 0.7rem; cursor: pointer; }
  .ruleta { display: flex; align-items: center; gap: 0.5rem; }
  .ruleta button { background: #2a2140; border: 1px solid #3a2f52; color: #fff6e9; border-radius: 8px; padding: 0.3rem 0.6rem; cursor: pointer; }
  .votos { font-variant-numeric: tabular-nums; opacity: 0.9; }
</style>
</head>
<body>
<main>
  <div id="escucha"></div>
</main>
<script type="module" src="./escucha.ts"></script>
</body>
</html>
