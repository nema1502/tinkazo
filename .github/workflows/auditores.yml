# Auditores con navegador, a pedido.
#
# NUNCA se capturan vistas con datos de personas reales (una lista de invitados, una campaña de
# verdad): el artefacto de capturas de un repositorio público lo puede bajar cualquiera. Solo la
# demostración y las páginas públicas.
#
# La revisión de cada pedido (ci.yml) corre las pruebas y unas pocas comprobaciones. Los
# auditores de `scripts/` abren el sitio construido en un Chrome de verdad y tardan mucho más:
# acá se lanzan a mano, desde la pestaña Actions («Run workflow») o con
# `gh workflow run auditores.yml`. Esta corrida NO es una de las comprobaciones que exige la
# rama principal y no las toca: no bloquea nada.
#
# Se construye el sitio una sola vez (`construir`) y cada auditor corre en su propia máquina,
# a la vez que los demás, sirviendo ese mismo `dist/` con `pnpm preview` en el puerto 4173 (el
# que los guiones esperan por defecto). Como cada trabajo es una máquina distinta, los puertos
# de Chrome y del servidor no chocan.
#
# Qué entra y qué no. Entran los que se pueden correr en una máquina de GitHub: sin cuenta con
# fondos y sin placa de video. Quedan afuera los que sellan en la red de pruebas con una cuenta
# (`audit-flujo.mjs`, `audit-modos.mjs`, `audit-detalles.mjs`) y los que miden fluidez, sonido o
# física con la placa de video (`audit-rigor.mjs`, `audit-emocion.mjs`, `audit-tacto.mjs`,
# `audit-sound.mjs`, `audit-mezcla.mjs`, `audit-choques.mjs`, `audit-fisica.mjs`): esos se
# siguen corriendo en la máquina de quien desarrolla (ver docs/juegos.md).
#
# Dos grupos:
#   - Los de siempre cuentan: si fallan, la corrida queda en rojo. Son las palabras que el
#     sitio no puede decir (sin navegador), las páginas de lectura (las mismas que ya mira la
#     revisión de cada pedido) y la prueba de humo de cada juego del selector, que carga la
#     demostración con la ronda real de drand y exige que aparezca la tarjeta del ganador.
#   - Los EXPERIMENTALES (`experimental: true`) pueden fallar sin poner la corrida en rojo
#     (`continue-on-error`): la máquina de GitHub no tiene placa de video, Chrome dibuja con
#     WebGL por software, y las tipografías de Linux miden distinto a las de la máquina donde
#     se calibraron las reglas. Fallan por la máquina tanto como por el sitio, así que su
#     resultado se lee, pero no se toma como veredicto. Cuando uno pase varias corridas
#     seguidas, se le saca la marca.
#
# Capturas de cualquier vista de cualquier rama. Con el dato `vistas` (una lista JSON, ver
# `scripts/capturar-vistas.mjs`), la corrida NO audita: construye la rama pedida, saca las capturas
# con un solo trabajo y las sube como el artefacto `capturas-vistas` (con un `informe.json`), que se
# guarda un solo día. Los datos de entrada son tres, todos opcionales:
#   - `vistas`: la lista de vistas, en JSON. Con este dato vacío, todo corre como siempre.
#   - `rama`: la rama, la etiqueta o el commit del mismo repositorio que se construye y se
#     captura. Vacío, la misma desde donde se lanzó la corrida.
#   - `entorno`: variables de construcción del sitio, separadas por espacios, por ejemplo
#     `VITE_CAMPANAS=1`. Solo nombres que empiezan con VITE_ y valores de letras, números y _ . : / -
# `rama` y `entorno` sin `vistas` no valen: la corrida falla enseguida en vez de correr los auditores.
# El guion que saca las fotos es el de la rama desde donde se lanzó la corrida (la herramienta), y el
# sitio que se fotografía es el de `rama`: dos copias del repositorio en la máquina.
# Ejemplo (cambiá MI-RAMA por la rama que trae la herramienta, e ID por el número de la corrida
# que muestra `gh run list`):
#   gh workflow run auditores.yml --ref MI-RAMA \
#     -f rama=main -f entorno=VITE_CAMPANAS=1 \
#     -f vistas='[{"nombre":"portada","ruta":"/","ancho":1440,"alto":900,"tema":"light"}]'
#   gh run download ID -n capturas-vistas -D capturas
# Los datos de entrada nunca se escriben dentro de un comando: llegan por variables de entorno y se
# validan antes de construir nada. No usa ningún secreto y los permisos son de solo lectura.
#
# La caché de Actions. El trabajo de capturas no usa la caché de pnpm, pero eso no alcanza: construir una
# rama corre su código (la instalación, la construcción) con el token de la corrida, y con él ese código
# podría guardar lo que quiera en la caché, en el ámbito de la rama desde donde se lanzó la corrida. Si
# esa es la rama principal, lo guardado lo lee después la revisión de la principal. Por eso desde la rama
# principal no se construye otra rama: la validación lo corta. Se lanza desde otra rama (--ref MI-RAMA) o
# sin `rama`, que construye la principal misma. Tampoco se acepta una referencia de pedido (pull/N/head,
# refs/...): sería código de una bifurcación.
#
# Para ver andar este archivo antes de que esté en la rama principal, se dispara también en
# un pedido que lo cambie (el botón «Run workflow» solo aparece cuando el archivo ya está en
# la rama por defecto). Las acciones van fijadas por SHA (ver el encabezado de ci.yml).
name: Auditores a pedido

on:
  workflow_dispatch:
    inputs:
      vistas:
        description: 'Capturas: lista JSON de vistas (ver scripts/capturar-vistas.mjs). Con esto, no corren los auditores.'
        required: false
        default: ''
        type: string
      rama:
        description: 'Capturas: rama, etiqueta o commit a construir (vacío: la misma de la corrida)'
        required: false
        default: ''
        type: string
      entorno:
        description: 'Capturas: variables de construcción separadas por espacios, por ejemplo VITE_CAMPANAS=1'
        required: false
        default: ''
        type: string
  pull_request:
    paths:
      - .github/workflows/auditores.yml

permissions:
  contents: read

concurrency:
  # Cada corrida de capturas tiene su propio grupo: dos pedidos de capturas desde la misma rama no se cancelan entre sí.
  group: ${{ github.workflow }}-${{ github.ref }}${{ inputs.vistas != '' && format('-capturas-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  construir:
    name: Construir el sitio
    # Un pedido que viene de una bifurcación no corre la matriz: son quince máquinas. El trabajo
    # que audita depende de este, así que tampoco corre. Con `vistas` tampoco: eso es una corrida de capturas.
    # Y con `rama` o `entorno` sin `vistas` tampoco: ver `datos-a-medias`.
    if: ${{ inputs.vistas == '' && inputs.rama == '' && inputs.entorno == '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sitio-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  # Rama o entorno sin vistas: son datos de las capturas, y sin la lista no hay capturas. Se avisa en vez de
  # ignorarlos y correr los quince auditores sin que nadie lo pidiera.
  datos-a-medias:
    name: Datos que faltan
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.vistas == '' && (inputs.rama != '' || inputs.entorno != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "::error::Mandaste rama o entorno sin vistas. Son datos de las capturas: mandá también la lista de vistas, o sacá rama y entorno para correr los auditores."
          exit 1

  auditar:
    name: Auditar ${{ matrix.nombre }}${{ matrix.experimental && ' (experimental)' || '' }}
    needs: construir
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: palabras
            nombre: las palabras prohibidas
            comando: 'node scripts/audit-palabras.mjs'
            navegador: false
            experimental: false
          - id: paginas
            nombre: las páginas de lectura
            comando: 'node scripts/check-paginas.mjs --base http://localhost:4173'
            navegador: true
            experimental: false
          - id: humo-race
            nombre: prueba de humo de race
            comando: 'node scripts/smoke.mjs "http://localhost:4173/?demo=race&instant=1&lead=3" --timeout 120000'
            navegador: true
            experimental: false
          - id: humo-sapo
            nombre: prueba de humo de sapo
            comando: 'node scripts/smoke.mjs "http://localhost:4173/?demo=sapo&instant=1&lead=3" --timeout 120000'
            navegador: true
            experimental: false
          - id: humo-trompo
            nombre: prueba de humo de trompo
            comando: 'node scripts/smoke.mjs "http://localhost:4173/?demo=trompo&instant=1&lead=3" --timeout 120000'
            navegador: true
            experimental: false
          - id: humo-chovena
            nombre: prueba de humo de chovena
            comando: 'node scripts/smoke.mjs "http://localhost:4173/?demo=chovena&instant=1&lead=3" --timeout 120000'
            navegador: true
            experimental: false
          - id: humo-pinata
            nombre: prueba de humo de pinata
            comando: 'node scripts/smoke.mjs "http://localhost:4173/?demo=pinata&instant=1&lead=3" --timeout 120000'
            navegador: true
            experimental: false
          - id: humo-wheel
            nombre: prueba de humo de wheel
            comando: 'node scripts/smoke.mjs "http://localhost:4173/?demo=wheel&instant=1&lead=3" --timeout 120000'
            navegador: true
            experimental: false
          - id: humo-teleferico
            nombre: prueba de humo de teleferico
            comando: 'node scripts/smoke.mjs "http://localhost:4173/?demo=teleferico&instant=1&lead=3" --timeout 120000'
            navegador: true
            experimental: false
          - id: humo-oruro
            nombre: prueba de humo de oruro
            comando: 'node scripts/smoke.mjs "http://localhost:4173/?demo=oruro&instant=1&lead=3" --timeout 120000'
            navegador: true
            experimental: false
          - id: humo-guajojo
            nombre: prueba de humo de guajojo
            comando: 'node scripts/smoke.mjs "http://localhost:4173/?demo=guajojo&instant=1&lead=3" --timeout 120000'
            navegador: true
            experimental: false
          - id: humo-toborochi
            nombre: prueba de humo de toborochi
            comando: 'node scripts/smoke.mjs "http://localhost:4173/?demo=toborochi&instant=1&lead=3" --timeout 120000'
            navegador: true
            experimental: false
          - id: interfaz
            nombre: la interfaz
            comando: 'node scripts/audit-ui.mjs --base http://localhost:4173 --sin-juegos --out capturas'
            navegador: true
            experimental: true
          - id: letra
            nombre: la letra de las páginas
            comando: 'node scripts/audit-legible.mjs --paginas --base http://localhost:4173 --out capturas'
            navegador: true
            experimental: true
          - id: juego-wheel
            nombre: las 20 comprobaciones de la ruleta
            comando: 'node scripts/audit-game.mjs wheel --base http://localhost:4173 --out capturas'
            navegador: true
            experimental: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ matrix.navegador }}
        with:
          name: sitio-dist
          path: dist
      - name: Auditar
        env:
          NAVEGADOR: ${{ matrix.navegador }}
          COMANDO: ${{ matrix.comando }}
        run: |
          if [ "$NAVEGADOR" = "true" ]; then
            pnpm preview --port 4173 &
            npx wait-on@9.5.1 http://localhost:4173 --timeout 60000
          fi
          bash -c "$COMANDO"
      - name: Aviso de experimental
        if: ${{ failure() && matrix.experimental }}
        run: |
          echo "::warning::${{ matrix.nombre }} es experimental y falló. Se lee, pero no cuenta como veredicto del sitio."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && matrix.navegador }}
        with:
          name: capturas-${{ matrix.id }}
          path: capturas
          if-no-files-found: ignore
          retention-days: 7

  # Capturas de las vistas pedidas (ver la cabecera). Solo con el dato `vistas`.
  capturas:
    name: Capturas de las vistas pedidas
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.vistas != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # La herramienta: el guion de capturas de la rama desde donde se lanzó la corrida.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: herramienta
          persist-credentials: false
      # Los datos de entrada se validan antes de construir nada. Llegan por variables de entorno
      # y no se escriben dentro del comando. Las variables válidas pasan a las del resto del trabajo.
      - name: Validar los datos de entrada
        env:
          VISTAS_JSON: ${{ inputs.vistas }}
          RAMA: ${{ inputs.rama }}
          RAMA_PRINCIPAL: ${{ github.event.repository.default_branch }}
          ENTORNO: ${{ inputs.entorno }}
        run: node herramienta/scripts/capturar-vistas.mjs --validar --entorno-en "$GITHUB_ENV"
      # El sitio a fotografiar: la rama pedida o, sin ella, la misma de la herramienta.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.rama || github.sha }}
          path: sitio
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Instalar y construir el sitio
        working-directory: sitio
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Servir el sitio y sacar las capturas
        env:
          VISTAS_JSON: ${{ inputs.vistas }}
        run: |
          (cd sitio && pnpm preview --port 4173 &)
          npx wait-on@9.5.1 http://localhost:4173 --timeout 60000
          node herramienta/scripts/capturar-vistas.mjs --base http://localhost:4173 --out capturas
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: capturas-vistas
          path: capturas
          if-no-files-found: ignore
          retention-days: 1
