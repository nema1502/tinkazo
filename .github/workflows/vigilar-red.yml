# Vigilancia de la red de Stellar.
#
# Cada media hora mira, en testnet y en mainnet, los parámetros de costo de
# Soroban y cuánto estado vivo tiene la red frente a su objetivo. La corrida falla
# solo cuando hay algo nuevo que decir: un parámetro o el protocolo cambió y es la
# primera vez que se ve ese estado de la red, el nivel de alguna red se movió
# respecto de la corrida anterior (hacia arriba o hacia abajo), una red está en
# rojo, o no se pudo mirar una red. Que falle es el aviso: GitHub manda un correo
# por la corrida fallida a quien editó el `cron` por última vez, sin depender de
# ninguna laptop prendida. Lo que sigue igual pasa, y queda en el nombre del paso:
# un nivel que no se movió («mainnet amarillo (igual que antes)») y una línea base
# vieja que ya se avisó («línea base vieja: testnet, <parámetro>»), hasta que se
# actualice la base. Si no, el correo sería un ruido que alguien acaba silenciando.
#
# Una vez al día (12:07 UTC) corre con `--diario` y falla también si una red sigue
# en naranja o si la línea base sigue vieja, aunque no haya cambiado nada: un
# recordatorio mientras dure. Puede caer poco después de un aviso (el de las 11:43
# y el recordatorio de las 12:07 están a 24 minutos): se acepta.
#
# Lo que ya se avisó vive en la caché de Actions: el nivel de cada red y, de cada
# red con la línea base vieja, lo que se avisó: la huella (sha256) del estado de la
# red, la de la línea base contra la que se avisó y la de cada parámetro. Se olvida
# cuando alguien commitea una base nueva; si la red coincide con la base una sola
# corrida (un RPC atrasado), se queda. Una clave nueva por corrida
# (`vigilar-red-<número de corrida>`, que nunca existe) y `restore-keys` trae la
# más reciente. Se guarda también cuando la corrida falla; si no, el mismo aviso se
# repetiría cada media hora. Sin caché (la primera vez), el nivel de antes es
# «normal» y nada se avisó: se comporta como un detector sin memoria. Si la red
# cambia otra vez, la huella es otra y vuelve a avisar, y dice qué cambió desde el
# último aviso.
#
# Solo lee de los RPC públicos: no instala nada (el guion no tiene dependencias, solo
# Node) y su único secreto es el opcional HEALTHCHECK_URL, el latido del último paso.
# Las acciones van fijadas por SHA (ver el encabezado de ci.yml).
#
# Qué vigila, qué significa cada nivel y cómo actualizar la línea base:
# docs/deployments.md, «Vigilancia de la red».
name: Vigilar la red de Stellar

on:
  schedule:
    # Cada media hora, pero fuera de los minutos 0 y 30, donde GitHub se
    # congestiona y suele demorar o saltear corridas.
    - cron: '13,43 * * * *'
    # El recordatorio diario. Si se cambia esta hora, cambiar también la de abajo.
    - cron: '7 12 * * *'
  workflow_dispatch:
    inputs:
      diario:
        description: 'Correr como el recordatorio diario (falla también si una red sigue en naranja o la línea base sigue vieja)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vigilar-red
  cancel-in-progress: false

jobs:
  vigilar:
    name: Mirar testnet y mainnet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Solo scripts/: el guion y su línea base. El resto del repo no hace falta.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # scripts/lib/umbrales-red.mjs lee los umbrales de src/stellar/red-umbrales.json
          sparse-checkout: |
            scripts
            src/stellar/red-umbrales.json
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Recuperar lo que se avisó en la corrida anterior
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .estado-red
          key: vigilar-red-${{ github.run_id }}
          restore-keys: vigilar-red-
      - name: Mirar testnet y mainnet
        id: vigilar
        env:
          # La corrida de las 12:07 UTC (o la manual con la casilla) es el recordatorio.
          DIARIO: "${{ (github.event.schedule == '7 12 * * *' || inputs.diario) && '--diario' || '' }}"
        # `niveles.json` conserva el nombre de cuando solo guardaba el nivel de cada red:
        # ahora trae también la huella de los parámetros que ya se avisaron.
        run: node scripts/vigilar-red.mjs --anterior .estado-red/niveles.json --guardar .estado-red/niveles.json $DIARIO
      # El nivel de cada red y, si la línea base está vieja, cuál parámetro: a la vista
      # en la lista de pasos sin abrir el log.
      - name: "Nivel: ${{ steps.vigilar.outputs.resumen }}"
        if: always()
        env:
          RESUMEN: ${{ steps.vigilar.outputs.resumen }}
        run: echo "$RESUMEN"
      # Aunque la corrida haya fallado: el aviso de hoy no se repite mañana a esta hora.
      - name: Guardar lo avisado para la próxima corrida
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .estado-red
          key: vigilar-red-${{ github.run_id }}
      # El latido: avisa a un servicio de alarma (healthchecks.io) que el detector corrió, y
      # lo hace también si la corrida falló por una alarma de la red: lo que el servicio
      # vigila es que el detector no calle (el cron se saltea, o GitHub desactiva el workflow
      # tras 60 días sin actividad), no cómo está la red. Si pasan 2 horas sin latido, el
      # servicio manda un correo. Opcional: sin el secreto HEALTHCHECK_URL no hace nada.
      # (`secrets` no se puede usar en un `if`, por eso el secreto pasa por `env`.)
      - name: Latido para el servicio de alarma
        if: always()
        env:
          URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "Sin HEALTHCHECK_URL: no hay latido que mandar."
            exit 0
          fi
          curl -fsS -m 10 --retry 3 "$URL"
