name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Contratos Soroban
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace
      - name: Build WASM
        run: cargo build --release --target wasm32v1-none -p tinkazo-raffle
      - name: Tamaño del contrato
        run: ls -la target/wasm32v1-none/release/*.wasm

  web:
    name: Sitio (Vite + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Las tarjetas de historia afirman hechos con fuente primaria. Una fuente
      # caída es un dato inventado a los seis meses, así que se comprueba acá.
      - name: Fuentes de las tarjetas de historia
        run: node scripts/check-lore.mjs
      # Las páginas de lectura se rompen en silencio: una imagen que no está,
      # una clave de idioma que falta, un enlace del pie a una página borrada.
      - name: Páginas de lectura
        run: |
          pnpm preview --port 4173 &
          npx wait-on http://localhost:4173 --timeout 60000
          node scripts/check-paginas.mjs --base http://localhost:4173
