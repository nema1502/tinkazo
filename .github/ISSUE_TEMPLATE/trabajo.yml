name: Trabajo del equipo (solo equipo)
description: Para el equipo. Si sos de afuera, usá los otros dos formularios.
body:
  - type: markdown
    attributes:
      value: |
        Este formulario es para quienes tienen permiso de escritura y repite la forma de los issues que ya tenemos. La dirección pone la etiqueta de la zona al clasificar el issue. Antes de tomar un trabajo de otra persona, preguntá en su issue.
  - type: dropdown
    id: zona
    attributes:
      label: Zona
      description: El reparto está en https://github.com/nema1502/tinkazo/issues/277
      options:
        - Frente
        - Servicios
        - Dirección
    validations:
      required: true
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Lo que hay hoy, con lo medido y el lugar exacto donde se ve.
    validations:
      required: true
  - type: textarea
    id: por-que
    attributes:
      label: Por qué importa
      description: Qué problema real resuelve y a quién se lo resuelve.
    validations:
      required: true
  - type: textarea
    id: donde-esta
    attributes:
      label: Dónde está
      description: Los archivos y las carpetas, uno por renglón.
      placeholder: |
        - `src/ui/...`: qué hay ahí
    validations:
      required: true
  - type: textarea
    id: que-se-quiere
    attributes:
      label: Qué se quiere
      description: Lo que tiene que quedar hecho, en pasos o en una lista.
    validations:
      required: true
  - type: textarea
    id: como-se-comprueba
    attributes:
      label: Cómo se comprueba
      description: Los comandos, las pruebas o lo que se mira a simple vista para dar el trabajo por terminado.
    validations:
      required: true
  - type: textarea
    id: que-no-se-toca
    attributes:
      label: Qué no se toca
      description: Archivos o comportamientos que tienen que quedar igual.
  - type: textarea
    id: de-que-depende
    attributes:
      label: De qué depende
      description: Otros issues, pedidos o ramas que tienen que entrar antes. Si de nada, escribí que de nada.
  - type: checkboxes
    id: cuidado
    attributes:
      label: Antes de enviar
      options:
        - label: No puse secretos, llaves ni datos de otras personas
          required: true
