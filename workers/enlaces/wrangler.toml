# Enlaces cortos para los comprobantes y el contador anónimo del embudo (ver README.md).
# Se despliega con: npx wrangler@4 deploy   (desde esta carpeta)
name = "tinkazo-enlaces"
account_id = "d97c3f7acada21d5ec280704fb34ff17"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [{ pattern = "c.tinkazo.app/*", zone_name = "tinkazo.app" }]

[[durable_objects.bindings]]
name = "ALMACEN"
class_name = "Almacen"

# El contador: sumas por día, en su propio objeto.
[[durable_objects.bindings]]
name = "CONTADOR"
class_name = "Contador"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Almacen"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Contador"]
