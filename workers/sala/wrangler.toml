# La sala de Tinkazo: nombres cifrados de un stand, en s.tinkazo.app (ver README.md).
# Un script aparte del de los enlaces: un error de despliegue acá no puede tumbar los enlaces de los comprobantes.
# Se despliega con: npx wrangler@4 deploy   (desde esta carpeta)
name = "tinkazo-sala"
account_id = "d97c3f7acada21d5ec280704fb34ff17"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = false
# Dominio propio: Cloudflare crea el registro DNS y el certificado al desplegar.
routes = [{ pattern = "s.tinkazo.app", custom_domain = true }]

# Un objeto por sala, con SQLite y una alarma a las 10 h que borra todo.
[[durable_objects.bindings]]
name = "SALA"
class_name = "Sala"

# Un objeto, "cupos": cuántas salas se crean por dirección y por día.
[[durable_objects.bindings]]
name = "CUPOS"
class_name = "Cupos"

# El envío de correo de Cloudflare, para avisarle a quien gana. Sin restricciones de destino: la sala le escribe a la cuenta que
# la red dice que ganó. Sin el dominio habilitado en el panel, `send` falla y el aviso se pierde sin romper nada (ver README.md).
[[send_email]]
name = "CORREO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sala", "Cupos"]

[vars]
# Los RPC de la red principal donde la sala lee el sello y el resultado: los mismos de RPC_LISTAS.mainnet en src/stellar/config.ts.
RPC_MAINNET = "https://mainnet.sorobanrpc.com,https://rpc.lightsail.network"
# La app del proveedor de cuentas de la red principal: el mismo valor público que el portero.
POLLAR_APP_ID = "cmw6osdl600080imq38rz1vvu"
# El pase del QR se exige. En "0" se apaga, solo si algo falla el día del evento.
PASE = "1"
# "estricto": entra solo quien el proveedor dice, exactamente, que es de Google. Es el valor por defecto: cualquier otro valor
# (o ninguno) también es estricto. "suave" es solo un interruptor de emergencia: deja entrar y cuenta aparte a quien el
# proveedor no dice por dónde entró. Una vía que no es Google no entra en ningún modo.
SOLO_GOOGLE = "estricto"
# El aviso por correo a quien gana nace apagado: solo con "1" la sala lo manda. El remitente es una dirección del dominio ya
# habilitado para el envío.
CORREO_GANADORAS = "1"
CORREO_DE = "hola@tinkazo.app"

# La activación al pagar (POST /v1/activar, ver README.md): la sala firma sola el archivo de una campaña cuando comprueba en la red
# que la comisión del evento se pagó desde la cuenta de Google de quien organiza. Solo con "1" está prendida.
ACTIVAR_AL_PAGAR = "1"
# Lo que se cobra: los mismos números que el sitio (VITE_COMISION_PB, VITE_COMISION_MINIMO, VITE_RETIRO_COSTO).
COMISION_PB = "200"
COMISION_MINIMO = "1.50"
COSTO_RETIRO = "0.50"
# La cuenta que recibe la comisión: la misma de VITE_COMISION_CUENTA del sitio, que ya es pública en sus páginas. Vacía, la
# activación queda apagada (503 apagada): nunca mira pagos a una cuenta que no es la que cobra. Escribirla no prende nada por
# sí sola: sin los secretos CAMPANAS_LLAVE_AUTO y SALA_SECRETO la ruta sigue en 503 sin-llave.
COMISION_CUENTA = "GDJFIZCMUKQM3GHSIJXZ5CR7S2HRJB5GO5NUA2I55HVUV54FW32M2HYM"
# El portero de la red principal: la sala le pide que dé acceso a quien organiza antes de firmar.
PORTERO_URL = "https://pm.tinkazo.app"
# Secretos (se cargan con `npx wrangler@4 secret put`, nunca en este archivo): CAMPANAS_LLAVE_AUTO (la llave privada Ed25519
# de la activación automática, 32 bytes en hexadecimal), SALA_SECRETO (el mismo que el portero) y POLLAR_SECRETO.
