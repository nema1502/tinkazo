[package]
name = "tinkazo-premios"
version = "0.2.0"
edition = "2021"
publish = false
license = "MIT"
description = "Premios garantizados: custodia del premio y pago a la cuenta que eligió un sorteo sellado en tinkazo-raffle"

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
