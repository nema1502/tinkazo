server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /c/ {
        try_files /c.html =404;
        add_header X-Robots-Tag "noindex" always;
    }

    # El index.html nunca se cachea: es el que nombra el build nuevo. Sin esto, un
    # teléfono se queda con el HTML (y el JS) viejo aunque la VPS ya tenga el nuevo.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
