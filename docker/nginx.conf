server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /c/ {
        try_files /c.html =404;
        add_header X-Robots-Tag "noindex" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
